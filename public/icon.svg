      <path d="M -10 62 L -32 88 M 10 62 L 32 88 M -36 84 L 36 84" stroke="url(#goldMetallic)" stroke-width="4.5" stroke-linecap="round" />
      <line x1="-68" y1="14" x2="-22" y2="20" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" opacity="0.55" />
      <line x1="-70" y1="28" x2="-20" y2="34" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" opacity="0.55" />
